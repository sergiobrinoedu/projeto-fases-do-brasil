services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    storage_opt:
      size: 1g
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --innodb-page-size=4K
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: