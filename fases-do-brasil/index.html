<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#895406" />
    <meta name="description" content="Linha do tempo interativa 3D das fases da História do Brasil, de 1500 à atualidade." />
    <title>Fases do Brasil — Linha do Tempo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23895406'/%3E%3Cpath d='M16 4 L19 16 L16 28 L13 16Z' fill='%23debf88'/%3E%3Cpath d='M4 16 L16 13 L28 16 L16 19Z' fill='%23e69d3d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="loader" class="loader" role="status" aria-live="polite"><span class="loader__ring"></span><span>Carregando a história…</span></div>

    <div class="bg-flow" aria-hidden="true"></div>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="bubbles" class="bubbles" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header id="navbar" class="navbar-mount"></header>

    <main id="app">
      <!-- Rota: / -->
      <section id="page-home" class="page page--home" aria-labelledby="titulo">
        <div class="hero__head hero__head--compact">
          <span class="eyebrow">1500 — Presente</span>
          <h1 id="titulo">Fases do <em>Brasil</em></h1>
          <div class="journey" aria-live="polite">
            <div class="journey__bar" aria-hidden="true"><i></i></div>
            <p class="journey__text"></p>
            <button type="button" class="journey__reset" hidden>Reiniciar progresso</button>
          </div>
        </div>
        <div id="timeline" class="timeline" aria-label="Linha do tempo horizontal das fases da História do Brasil">
          <div class="tl-stage"></div>
        </div>
      </section>

      <!-- Rota: /sobre -->
      <section id="page-sobre" class="page page--content" hidden><div class="container"></div></section>

      <!-- Rota: /equipe -->
      <section id="page-equipe" class="page page--content" hidden><div class="container"></div></section>

      <!-- Rota: /login (entrar / cadastrar) -->
      <section id="page-login" class="page page--content page--auth" hidden aria-label="Entrar ou cadastrar-se"><div class="container"></div></section>
    </main>

    <footer class="footer">
      <p>Fases do Brasil — projeto educacional · Conteúdo baseado no guia cronológico da História do Brasil.</p>
    </footer>

    <div id="detail" class="detail" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
